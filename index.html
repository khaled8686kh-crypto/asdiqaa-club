<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فريق الأصدقاء الرياضي — إدارة النادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12306B; --navy-deep:#0B1F47; --gold:#C9A23F; --gold-soft:#E8D49A; --yellow:#F4C430;
  --carbon:#1C1F26; --maroon:#7A1F2B; --ok:#1F7A4A; --warn:#B4541A;
  --paper:#F3F4F7; --surface:#FFFFFF; --ink:#161A22; --muted:#5B6474; --line:#D9DCE3; --chip:#EEF1F7;
  --side-bg:#0B1F47; --side-ink:#E8ECF5;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1320; --surface:#161D2D; --ink:#E9ECF2; --muted:#A3ADBF; --line:#2A3348; --chip:#1E2740;
    --side-bg:#080F22; --navy:#3D69C7; --ok:#3FB37A; --warn:#E38B4F; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1320; --surface:#161D2D; --ink:#E9ECF2; --muted:#A3ADBF; --line:#2A3348; --chip:#1E2740;
  --side-bg:#080F22; --navy:#3D69C7; --ok:#3FB37A; --warn:#E38B4F; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:600;margin:0;line-height:1.3}
img{max-width:100%}
main a{color:var(--navy)}
:root[data-theme="dark"] main a{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) main a{color:var(--yellow)}}
main a.btn{color:var(--navy-deep);text-decoration:none}
.fmeta a{color:var(--yellow)!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:var(--side-bg);color:var(--side-ink);padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-left:4px solid var(--gold)}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:16px;border-bottom:1px solid rgba(201,162,63,.35);margin-bottom:12px}
.brand img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.brand h1{font-size:19px;color:var(--yellow)}
.brand small{color:var(--gold-soft);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--side-ink);text-decoration:none;padding:9px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{background:var(--yellow);color:var(--navy-deep);font-weight:700}
.nav .ico{width:22px;text-align:center}
.side-foot{margin-top:16px;font-size:12px;color:var(--gold-soft);display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.08)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pill.cloud i{background:#3FB37A}
.themebtn{background:transparent;border:1px solid rgba(201,162,63,.5);color:var(--side-ink);border-radius:8px;padding:5px 10px;cursor:pointer}

main{padding:28px clamp(14px,3vw,36px) 60px;min-width:0}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:3px solid var(--gold)}
.pagehead h2{font-size:28px;color:var(--navy)}
:root[data-theme="dark"] .pagehead h2{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pagehead h2{color:var(--yellow)}}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.gold{background:var(--yellow);color:var(--navy-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--maroon)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel h3{font-size:18px;margin-bottom:12px;color:var(--navy)}
:root[data-theme="dark"] .panel h3{color:var(--gold-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel h3{color:var(--gold-soft)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{background:var(--chip);font-weight:600;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
tr.struck td{opacity:.5}
tr.struck td.nm{text-decoration:line-through}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--chip);display:inline-block;vertical-align:middle;border:2px solid var(--gold)}
.shirt{display:inline-grid;place-items:center;min-width:34px;height:30px;border-radius:6px 6px 10px 10px;background:var(--navy);color:var(--yellow);font-weight:700;font-family:"Reem Kufi",sans-serif}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip)}
.tag.main{background:#DCE6FA;color:#12306B}
.tag.foreign{background:#FBEFC8;color:#6B4E00}
.tag.u18{background:#E4F3E9;color:#1F5A3A}
.tag.struck{background:#F5DCDF;color:#7A1F2B}
.tag.pending{background:#FFF1DE;color:#8A4A10}
select.inline{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:linear-gradient(180deg,var(--navy-deep),#13285a);color:#fff;border-radius:16px;padding:26px;margin-bottom:20px;border-bottom:6px solid var(--yellow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border:30px solid rgba(244,196,48,.08);border-radius:50%}
.hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 8px rgba(201,162,63,.18)}
.hero h2{font-size:clamp(28px,4vw,44px);color:var(--yellow)}
.hero .sub{color:var(--gold-soft);margin:2px 0 14px}
.squad{display:flex;flex-wrap:wrap;gap:4px;max-width:640px}
.squad span{width:14px;height:20px;border-radius:4px 4px 7px 7px;border:1.5px solid rgba(255,255,255,.35)}
.squad span.f-main{background:#5C8BEA;border-color:#5C8BEA}
.squad span.f-foreign{background:var(--yellow);border-color:var(--yellow)}
.squad span.f-u18{background:#5FC88E;border-color:#5FC88E}
.squad .sep{width:8px;border:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:#dfe5f3}
.legend b{color:#fff}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-right:5px solid var(--gold);border-radius:10px;padding:12px 14px}
.fact .k{color:var(--muted);font-size:13px}
.fact .v{font-size:20px;font-weight:700}

/* forms */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);max-height:90vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,15,34,.55)}
.dlg-head{background:var(--navy-deep);color:var(--yellow);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--gold)}
.dlg-head h3{font-size:18px}
.dlg-body{padding:18px;overflow:auto;max-height:calc(90vh - 130px)}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);width:100%}
.field textarea{min-height:110px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.note{background:var(--chip);border-right:4px solid var(--yellow);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
.err{color:var(--maroon);font-weight:600;font-size:14px;min-height:1.2em}
:root[data-theme="dark"] .err{color:#F08A97}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#F08A97}}

/* register tiles */
.regcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.upl{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center;position:relative;background:var(--paper)}
.upl.has{border-style:solid;border-color:var(--gold)}
.upl img,.upl video{max-height:110px;border-radius:8px}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upl .big{font-size:30px}

/* match builder */
.counter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.counter span{padding:6px 12px;border-radius:8px;background:var(--chip);font-weight:600}
.counter span.full{background:var(--ok);color:#fff}
.rolebtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.rolebtn[aria-pressed="true"].s{background:var(--navy);color:#fff;border-color:var(--navy)}
.rolebtn[aria-pressed="true"].b{background:var(--yellow);color:var(--navy-deep);border-color:var(--yellow)}
input.num{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);text-align:center}

/* friendly card */
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),520px));gap:18px}
.fcard{border-radius:16px;overflow:hidden;background:linear-gradient(160deg,var(--navy-deep) 0%,#163a80 60%,var(--navy-deep) 100%);color:#fff;border:2px solid var(--gold)}
.fcard .top{padding:10px 16px;background:rgba(0,0,0,.25);display:flex;justify-content:space-between;color:var(--yellow);font-family:"Reem Kufi",sans-serif}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:20px 12px;text-align:center}
.vs img,.vs .ph{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#fff;margin:0 auto;display:grid;place-items:center;color:var(--navy);font-size:34px}
.vs .t{margin-top:8px;font-weight:700;font-size:16px}
.vs .x{font-family:"Reem Kufi",sans-serif;font-size:34px;color:var(--yellow)}
.fmeta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(201,162,63,.4)}
.fmeta div{background:rgba(11,31,71,.92);padding:9px 12px;font-size:14px}
.fmeta div b{display:block;color:var(--gold-soft);font-size:12px;font-weight:500}
.fmeta a{color:var(--yellow)}
.fcard .bar{padding:10px 12px;display:flex;gap:6px;justify-content:flex-end;background:rgba(0,0,0,.3)}

/* training week */
.week{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:160px;display:flex;flex-direction:column}
.day h4{margin:0;padding:8px 10px;background:var(--navy);color:var(--yellow);border-radius:9px 9px 0 0;font-family:"Reem Kufi",sans-serif;font-weight:600}
.sess{margin:8px;padding:8px;border-radius:8px;background:var(--chip);border-right:4px solid var(--gold);font-size:13px}
.sess b{display:block}

/* budget bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bars .r{display:grid;grid-template-columns:120px 1fr 90px;gap:8px;align-items:center;font-size:14px}
.bars .t{height:12px;border-radius:6px;background:var(--chip);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--gold)}
.money.in{color:var(--ok);font-weight:700}
.money.out{color:var(--maroon);font-weight:700}
:root[data-theme="dark"] .money.out{color:#F08A97}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .money.out{color:#F08A97}}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gallery figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.gallery img{width:100%;height:150px;object-fit:cover;display:block}
.gallery figcaption{padding:4px 8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.soc{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.soc .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--yellow);font-weight:700}
.soc a{color:var(--navy);word-break:break-all}

/* letterhead + match sheet (also used for print) */
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:28px 34px;max-width:800px;margin:auto;font-size:15px}
.lh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-bottom:4px double #C9A23F;padding-bottom:10px;margin-bottom:16px}
.lh img{width:84px;height:84px;border-radius:50%;object-fit:cover}
.lh .r{text-align:right}.lh .l{text-align:left}
.lh .nm{font-family:"Reem Kufi",sans-serif;font-size:20px;color:#12306B}
.lh .pt{font-size:13px;color:#7a5a10}
.doc .meta{display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px}
.doc .subj{text-align:center;font-weight:700;margin:12px 0;text-decoration:underline}
.doc .body{white-space:pre-wrap;line-height:2}
.doc .sign{margin-top:36px;text-align:left;line-height:1.8}
.doc .foot{margin-top:30px;border-top:2px solid #12306B;padding-top:6px;font-size:12px;color:#555;text-align:center}
.doc table th{background:#12306B;color:#fff}
.doc table td,.doc table th{border:1px solid #ccc;color:#111}
.doc h4{margin:14px 0 6px;color:#12306B;font-family:"Reem Kufi",sans-serif}

#login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(180deg,#0B1F47,#13285a);padding:20px}
#login[hidden]{display:none}
#loginForm{background:var(--surface);color:var(--ink);border-radius:16px;padding:26px;width:min(380px,100%);border-top:6px solid var(--yellow);display:flex;flex-direction:column;gap:12px;text-align:center}
#loginForm img{width:110px;height:110px;border-radius:50%;margin:auto;border:3px solid var(--gold);object-fit:cover}
#loginForm h2{color:var(--navy);font-size:22px}#loginForm p{margin:0;color:var(--muted)}#loginForm .field{text-align:right}

/* tactics */
.pitch{position:relative;aspect-ratio:68/100;width:100%;max-width:440px;margin:auto;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(0deg,#2E8B3E 0 10%,#278536 10% 20%);border:3px solid #fff;box-shadow:0 0 0 3px var(--gold);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;background:none;border:0;padding:0;color:#fff;font:inherit}
button.slot{cursor:pointer}
button.slot:hover .ph{box-shadow:0 0 0 3px rgba(244,196,48,.6)}
.slot .ph{position:relative;width:48px;height:48px;border-radius:50%;background:#0B1F47;border:2px solid #F4C430;display:grid;place-items:center}
.slot .ph img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.slot .ph b{color:#F4C430;font-family:"Reem Kufi",sans-serif;font-size:18px}
.slot .ph i{position:absolute;bottom:-5px;left:-7px;background:#F4C430;color:#0B1F47;font-style:normal;font-weight:700;font-size:11px;border-radius:6px;padding:0 4px;line-height:1.5}
.slot .nm{background:rgba(11,31,71,.88);font-size:11px;padding:1px 6px;border-radius:6px;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.slot.empty .ph{background:rgba(255,255,255,.14);border-style:dashed}
.slot.empty .nm{background:rgba(0,0,0,.35)}
.tactic{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:20px;align-items:start}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;background:#0B1F47;color:#fff;border-radius:14px;padding:16px;border-bottom:5px solid var(--yellow);margin-bottom:18px;font-weight:600}
.score img{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.score .n{font-family:"Reem Kufi",sans-serif;font-size:48px;color:var(--yellow);direction:ltr;padding:0 16px}
.evbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.evbtns .rolebtn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 6px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--gold)}
.chip .shirt{min-width:26px;height:24px;font-size:13px}
.chip.sub{border-style:dashed}
.chip:disabled{opacity:.4;cursor:not-allowed}
.rate{display:inline-grid;place-items:center;min-width:42px;height:26px;border-radius:6px;font-weight:700;color:#fff;padding:0 6px}
.recbox{border:2px solid var(--gold);border-radius:12px;padding:16px;background:var(--chip)}
.recbox .f{font-family:"Reem Kufi",sans-serif;font-size:32px;color:var(--navy)}
:root[data-theme="dark"] .recbox .f{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .recbox .f{color:var(--yellow)}}
.recbox ul,details.match ul{margin:6px 0;padding-inline-start:20px}
input[type=range]{width:100%;accent-color:var(--navy);padding:0;background:none;border:0}
.pick{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:hover{background:var(--chip)}
details.match{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:var(--surface)}
details.match summary{cursor:pointer}
.doc .pitch{max-width:300px}.doc .slot{width:62px}.doc .slot .ph{width:32px;height:32px}.doc .slot .nm{font-size:9px}
@media (max-width:860px){.tactic{grid-template-columns:1fr}.slot{width:62px}.slot .ph{width:36px;height:36px}.slot .ph b{font-size:14px}.slot .nm{font-size:10px;max-width:62px}.score .n{font-size:36px}.score img{width:48px;height:48px}}
#gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(180deg,#0B1F47,#13285a);padding:20px;overflow:auto}
#gate[hidden]{display:none}
.gatebox{background:var(--surface);color:var(--ink);border-radius:16px;padding:26px;width:min(390px,100%);border-top:6px solid var(--yellow);display:flex;flex-direction:column;gap:12px;text-align:center}
.gatebox img{width:110px;height:110px;border-radius:50%;margin:auto;border:3px solid var(--gold);object-fit:cover}
.gatebox h2{color:var(--navy);font-size:22px}.gatebox p{margin:0;color:var(--muted)}
.gatebox form{display:flex;flex-direction:column;gap:12px;text-align:right}.gatebox form[hidden]{display:none}.gatebox .btn{justify-content:center}
.gtabs{justify-content:center;margin:0}
.pin{font-size:30px!important;letter-spacing:14px;text-align:center;font-family:Tahoma,monospace}
body.ro-fin [data-act=newFin],body.ro-fin [data-act=editFin],body.ro-fin [data-act=delFin],body.ro-fin [data-act=payAll]{display:none!important}
#updBar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:55;background:var(--yellow);color:#0B1F47;border-radius:12px;padding:8px 10px 8px 16px;display:flex;gap:12px;align-items:center;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#updBar[hidden]{display:none}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset:0}
  #printArea .doc{border:0}
}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;background:var(--carbon);color:#fff;padding:10px 16px;border-radius:10px;border-right:4px solid var(--yellow);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;padding:10px 10px 6px;border-left:0;border-bottom:3px solid var(--gold);z-index:20}
  .brand{flex-direction:row;padding-bottom:8px;margin-bottom:6px;text-align:right}
  .brand img{width:44px;height:44px;border-width:2px}
  .brand h1{font-size:16px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{white-space:nowrap;padding:6px 10px;font-size:14px}
  .side-foot{flex-direction:row;align-items:center;margin-top:4px}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .hero img{width:110px;height:110px}
  .squad{justify-content:center}
  .doc{padding:18px}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side-bg)}
</style>
</head>

<div class="app">
  <aside class="side">
    <div class="brand">
      <img id="sideLogo" alt="شعار فريق الأصدقاء الرياضي">
      <div><h1>فريق الأصدقاء الرياضي</h1><small>تأسس عام ٢٠١٤ · الرابطة السودانية بمنطقة عسير</small></div>
    </div>
    <nav class="nav" id="nav"></nav>

      <button class="themebtn" id="themeBtn" type="button">تبديل الوضع الليلي</button>

      <button class="themebtn" id="logoutBtn" type="button" data-act="logout" hidden>تسجيل الخروج</button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<div id="gate" hidden><div class="gatebox"><img id="gateLogo" alt="شعار النادي"><h2>فريق الأصدقاء الرياضي</h2><p>برعاية الرابطة السودانية بمنطقة عسير</p>
<div class="tabs gtabs"><button type="button" data-gt="main" aria-pressed="true">الحساب الرئيسي</button><button type="button" data-gt="user" aria-pressed="false">دخول مستخدم</button></div>
<form id="gateMain"><div class="field"><label for="pin">رمز الدخول (6 أرقام)</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" dir="ltr"></div><button class="btn gold" type="submit">دخول</button></form>
<form id="gateUser" hidden><div class="field"><label for="gUser">اسم المستخدم</label><input id="gUser" dir="ltr" autocomplete="username" required></div><div class="field"><label for="gPass">كلمة المرور</label><input id="gPass" type="password" dir="ltr" autocomplete="current-password" required></div><button class="btn gold" type="submit">دخول</button></form>
<p class="err" id="gateErr" role="alert"></p></div></div>
<div id="updBar" hidden role="status"><span>يتوفر تحديث جديد للبرنامج</span><button class="btn sm" type="button" data-act="refreshApp">🔄 تحديث الآن</button></div>
<div id="printArea"></div>

/* ---------- helpers ---------- */
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function thisMonth(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function today(){return new Date().toISOString().slice(0,10)}
function ageOf(b){if(!b)return null;const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return isNaN(a)?null:a}
function catOf(p){if(p.nationality==="foreign")return "foreign";const a=ageOf(p.birth);return (a!==null&&a<18)?"u18":"main"}
function active(){return S.players.filter(p=>p.status!=="struck")}
function counts(){const c={main:0,foreign:0,u18:0};active().forEach(p=>c[catOf(p)]++);return c}
function money(n){return (Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:2})+" ر.س"}
function src(ref){if(!ref)return "";return ref.data||""}
function fileLink(ref,label){if(!ref)return "";if(ref.data)return `<a href="#" data-act="openData" data-u="${esc(ref.data)}">${label}</a>`;return `<a href="#" data-act="openFile" data-f="${esc(ref.file)}" data-l="${esc(label)}">${label}</a>`}
function fmtDate(d){if(!d)return "—";try{return new Date(d+"T00:00").toLocaleDateString("ar-SA-u-ca-gregory",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}catch(e){return d}}
function fmtTime(t){if(!t)return "—";const[h,m]=t.split(":");const H=+h;return ((H%12)||12)+":"+m+(H<12?" ص":" م")}
function byName(a,b){return (a.name||"").localeCompare(b.name||"","ar")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600)}
function opt(list,val){return list.map(([v,l])=>`<option value="${esc(v)}"${v===val?" selected":""}>${esc(l)}</option>`).join("")}
function fld(label,name,val,type="text",extra=""){return `<div class="field ${type==="textarea"?"full":""}"><label for="f_${name}">${label}</label>${type==="textarea"?`<textarea id="f_${name}" name="${name}" ${extra}>${esc(val)}</textarea>`:`<input id="f_${name}" name="${name}" type="${type}" value="${esc(val)}" ${extra}>`}</div>`}
function sel(label,name,pairs,val,extra=""){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}" ${extra}>${opt(pairs,val)}</select></div>`}
function personName(key){const [t,id]=[key[0],key.slice(2)];const col=t==="p"?S.players:t==="s"?S.staff:S.members;return (col.find(x=>x.id===id)||{}).name||"—"}

/* ---------- storage layer: cloud db when available, otherwise this device ---------- */
const LKEY="asdiqaa-club-v1";
function localLoad(){try{const d=JSON.parse(localStorage.getItem(LKEY)||"{}");COLS.forEach(c=>S[c]=d[c]||[]);S.settings=d.settings||{}}catch(e){}}
function localSave(){try{const d={settings:S.settings};COLS.forEach(c=>d[c]=S[c]);localStorage.setItem(LKEY,JSON.stringify(d))}catch(e){toast("تعذّر الحفظ على الجهاز — المساحة ممتلئة")}}
const LFILES="asdiqaa-files-v1";const memFiles={};
function clean(o){return JSON.parse(JSON.stringify(o))}
async function put(col,obj){
  const id=obj.id||uid();const data=clean({...obj});delete data.id;
  if(cloud){await fdb.ref(`club/${col}/${id}`).set(data)}
  else{const i=S[col].findIndex(x=>x.id===id);if(i>=0)S[col][i]={id,...data};else S[col].push({id,...data});localSave();render()}
  return id;
}
async function del(col,id){
  const item=S[col].find(x=>x.id===id);
  if(item)for(const v of Object.values(item))if(v&&typeof v==="object"&&v.file)await delFile(v.file);
  if(cloud){await fdb.ref(`club/${col}/${id}`).remove()}
  else{S[col]=S[col].filter(x=>x.id!==id);localSave();render()}
}
async function saveSettings(patch){
  const next=clean({...S.settings,...patch});
  if(cloud){await fdb.ref("club/settings").set(next)}else{S.settings=next;localSave();render()}
}
/* الملفات الكبيرة (الجواز، الفيديو، الصور الكاملة) تُحفظ منفصلة وتُحمَّل عند الطلب */
async function putFile(dataUrl){
  const id=uid();
  if(cloud){await fdb.ref("files/"+id).set(dataUrl)}
  else{memFiles[id]=dataUrl;try{const m=JSON.parse(localStorage.getItem(LFILES)||"{}");m[id]=dataUrl;localStorage.setItem(LFILES,JSON.stringify(m))}catch(e){toast("الملف محفوظ مؤقتاً فقط — مساحة الجهاز ممتلئة")}}
  return id;
}
async function getFile(id){
  if(cloud){return (await fdb.ref("files/"+id).get()).val()}
  if(memFiles[id])return memFiles[id];try{return JSON.parse(localStorage.getItem(LFILES)||"{}")[id]||null}catch(e){return null}
}
async function delFile(id){
  try{if(cloud)await fdb.ref("files/"+id).remove();else{delete memFiles[id];const m=JSON.parse(localStorage.getItem(LFILES)||"{}");delete m[id];localStorage.setItem(LFILES,JSON.stringify(m))}}catch(e){}
}
function showMedia(data,label){
  const isV=/^data:video/.test(data);
  openDlg(label,isV?`<video src="${data}" controls style="width:100%;max-height:65vh"></video>`:`<img src="${data}" alt="${esc(label)}" style="width:100%">`,async()=>"silent","إغلاق");
}
function attachCloud(){
  if(cloud)return;cloud=true;
  const pill=document.getElementById("syncPill");pill.classList.add("cloud");pill.querySelector("span").textContent="جاري التحميل…";
  const timer=setTimeout(()=>{pill.querySelector("span").textContent="تعذّر الوصول للبيانات — تحقق من الإنترنت"},10000);
  fdb.ref("club").on("value",snap=>{
    clearTimeout(timer);pill.querySelector("span").textContent="محفوظ ومتزامن";markReady();
    const v=snap.val()||{};
    COLS.forEach(c=>S[c]=Object.entries(v[c]||{}).map(([id,d])=>({id,...d})));
    S.settings=v.settings||{};scheduleRender();
  },e=>{clearTimeout(timer);pill.querySelector("span").textContent="لا توجد صلاحية قراءة";markReady();console.warn(e)});
}
let rq=null;function scheduleRender(){
  const ae=document.activeElement;if(ae&&ae.matches&&ae.matches("main input:not([type=file]),main textarea,main select")){render._pending=true;return}
  if(rq)return;rq=requestAnimationFrame(()=>{rq=null;if(!document.querySelector("dialog[open]"))render();else render._pending=true})}

async function compressImage(file,max=900,q=.78){
  const url=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function uploadFile(file,kind){
  if(!file||!file.size)return null;
  if(kind==="video"){
    if(file.size>6*1024*1024)throw new Error("حجم الفيديو أكبر من ٦ ميغابايت — اضغط الفيديو أو قصّره ثم أعد المحاولة");
    return {file:await putFile(await blobToData(file))};
  }
  if(kind==="photo")return {data:await blobToData(await compressImage(file,320,.78))};
  if(kind==="logo")return {data:await blobToData(await compressImage(file,260,.82))};
  if(kind==="passport")return {file:await putFile(await blobToData(await compressImage(file,1200,.75)))};
  throw new Error("نوع ملف غير معروف");
}

const dlg=document.getElementById("dlg");let dlgSubmit=null;
function openDlg(title,html,onSubmit,saveLabel="حفظ"){
  document.getElementById("dlgTitle").textContent=title;document.getElementById("dlgBody").innerHTML=html;
  document.getElementById("dlgErr").textContent="";document.getElementById("dlgSave").textContent=saveLabel;
  dlgSubmit=onSubmit;dlg.showModal();
}
function closeDlg(){dlg.close()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(render._pending&&!document.querySelector("dialog[open]")){const ae=document.activeElement;if(!(ae&&ae.matches&&ae.matches("main input:not([type=file]),main textarea,main select"))){render._pending=false;render()}}},50));
dlg.addEventListener("close",()=>{if(render._pending){render._pending=false;render()}});
document.getElementById("dlgForm").addEventListener("submit",async e=>{
  e.preventDefault();const btn=document.getElementById("dlgSave");const err=document.getElementById("dlgErr");
  const fd=new FormData(e.target);const o={};for(const [k,v] of fd.entries()){if(!(v instanceof File))o[k]=typeof v==="string"?v.trim():v}
  btn.disabled=true;err.textContent="";
  try{const ok=await dlgSubmit(o,fd);if(ok!==false){closeDlg();if(ok!=="silent")toast("تم الحفظ")}}catch(x){err.textContent=x.message||"تعذّر الحفظ"}finally{btn.disabled=false}
});

function budgetTotals(month){
  const inM=d=>month==="all"||(d||"").startsWith(month);
  const fin=S.finance.filter(f=>inM(f.date));
  const subsInc=S.subs.filter(s=>month==="all"||s.id===month).reduce((a,s)=>a+Object.values(s.paid||{}).reduce((x,y)=>x+(+y||0),0),0);
  const inc=fin.filter(f=>f.type==="in").reduce((a,f)=>a+(+f.amount||0),0)+subsInc;
  const out=fin.filter(f=>f.type==="out").reduce((a,f)=>a+(+f.amount||0),0);
  return {inc,out,subsInc,fin};
}

    ${sel("الجنسية","nationality",[["sudanese","سوداني"],["foreign","أجنبي"]],p.nationality)}
    ${fld("رقم الجواز / الإقامة","idno",p.idno)}${fld("رقم القميص","shirt",p.shirt,"number",'min="1" max="99"')}
    ${sel("الخانة","position",[["","—"],...POSITIONS.map(x=>[x,x])],p.position||"")}${fld("الجوال","phone",p.phone,"tel")}
    <div class="field"><label>تغيير الصورة الشخصية</label><input type="file" name="photo" accept="image/*"></div>

function printHTML(inner){
  const pa=document.getElementById("printArea");pa.innerHTML=inner;
  try{window.print()}catch(e){toast("الطباعة غير متاحة هنا — استخدم «حفظ كملف»")}

async function saveFile(name,inner){
  const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(name)}</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet"><style>${css}#printArea{display:block}body{background:#fff}</style></head><body>${inner}<script>setTimeout(()=>print(),600)<\/script></body></html>`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=name.replace(/[\\/:*?"<>|]/g,"-")+".html";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("تم حفظ الملف");
}

document.addEventListener("click",async e=>{const a=e.target.closest("[data-act]");if(!a)return;const f=ACT[a.dataset.act];if(!f)return;e.preventDefault();
  try{await f(a.dataset,a)}catch(x){toast(x.message||"تعذّر تنفيذ العملية")}});

document.addEventListener("change",async e=>{
  const t=e.target;const k=t.dataset.chg;
  try{
  if(t.form&&t.form.id==="regForm"&&t.name&&t.type!=="file")UI.reg[t.name]=t.value;
  if(k==="pos"){const p=S.players.find(x=>x.id===t.dataset.id);await put("players",{...p,position:t.value});toast("تم تحديث الخانة")}
  else if(k==="regfile"){const f=t.files[0];if(!f)return;keepReg();if(UI.reg[t.dataset.k])URL.revokeObjectURL(UI.reg[t.dataset.k].url);UI.reg[t.dataset.k]={file:f,url:URL.createObjectURL(f)};render()}
  else if(k==="shirtNo"){const s=UI.sheet;if(s.lineup[t.dataset.id])s.lineup[t.dataset.id].shirt=t.value}
  else if(k==="sheetStaff"){const s=UI.sheet;s.staffIds=t.checked?[...s.staffIds,t.dataset.id]:s.staffIds.filter(x=>x!==t.dataset.id)}
  else if(k==="subsMonth"){UI.subsMonth=t.value||thisMonth();render()}
  else if(k==="budgetMonth"){UI.budgetMonth=t.value;render()}
  else if(k==="gallery"){const files=[...t.files];toast("جاري رفع "+files.length+" صورة…");for(const f of files){const thumb={data:await blobToData(await compressImage(f,360,.72))};const img={file:await putFile(await blobToData(await compressImage(f,1600,.82)))};await put("gallery",{thumb,img,date:today(),caption:""})}toast("تمت إضافة الصور")}
  }catch(x){toast(x.message||"تعذّر الحفظ")}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.form&&t.form.id==="regForm"&&t.name&&t.type!=="file")UI.reg[t.name]=t.value;
  if(t.dataset.sh&&UI.sheet)UI.sheet[t.dataset.sh]=t.value;
  if(t.dataset.lt&&UI.letter){UI.letter[t.dataset.lt]=t.value;const pv=document.getElementById("letterPreview");if(pv)pv.innerHTML=letterDoc(UI.letter)}
  if(t.dataset.chg==="shirtNo"&&UI.sheet&&UI.sheet.lineup[t.dataset.id])UI.sheet.lineup[t.dataset.id].shirt=t.value;
});
function keepReg(){const f=document.getElementById("regForm");if(!f)return;const fd=new FormData(f);for(const [k,v] of fd.entries())if(typeof v==="string")UI.reg[k]=v}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="regForm")return;e.preventDefault();keepReg();const r=UI.reg;const err=document.getElementById("regErr");const btn=e.target.querySelector('button[type="submit"]');
  const p={name:(r.name||"").trim(),birth:r.birth,nationality:r.nationality,idno:r.idno,shirt:r.shirt,position:r.position,phone:r.phone,status:"active",registered:today()};
  if(!p.name||!p.birth){err.textContent="الاسم وتاريخ الميلاد مطلوبان";return}
  const c=counts(),cat=catOf(p);
  if(c[cat]>=CAPS[cat]){err.textContent=`اكتملت فئة «${CAT_LABEL[cat]}» (${CAPS[cat]} لاعبين). اشطب لاعباً أولاً أو غيّر الفئة.`;return}
  if(p.idno&&S.players.some(x=>x.idno===p.idno&&x.status!=="struck")){err.textContent="رقم الجواز/الإقامة مسجّل للاعب آخر";return}
  if(p.shirt&&S.players.some(x=>x.status!=="struck"&&String(x.shirt)===String(p.shirt))){err.textContent="رقم القميص "+p.shirt+" مستخدم";return}
  btn.disabled=true;err.textContent="جاري رفع المرفقات…";
  try{
    for(const k of ["photo","passport","video"])if(r[k])p[k]=await uploadFile(r[k].file,k);
    await put("players",p);["photo","passport","video"].forEach(k=>r[k]&&URL.revokeObjectURL(r[k].url));UI.reg={};toast("تم تسجيل "+p.name+" في الكشف");location.hash="roster";
  }catch(x){err.textContent=x.message||"تعذّر التسجيل"}finally{btn.disabled=false}
});

function shortName(n){const w=String(n||"").trim().split(/\s+/);return w.length>2?w[0]+" "+w[w.length-1]:w.join(" ")}
function grpOf(p){return GROUP_OF[p&&p.position]||"MID"}
function sheetEv(s){return Object.entries((s&&s.events)||{}).map(([id,e])=>({id,...e})).sort((a,b)=>(+a.min||0)-(+b.min||0))}
function scoreOf(s){const ev=sheetEv(s);return {us:ev.filter(e=>e.t==="goal").length,them:ev.filter(e=>e.t==="og").length}}
function oppVal(o){if(!o)return null;const v=OPP_F.map(([k])=>+o[k]).filter(x=>x>0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null}
function finishedSheets(){return S.sheets.filter(s=>s.finished).sort((a,b)=>(a.date||"").localeCompare(b.date||""))}
function rc(v){return v>=8?"#1F7A4A":v>=6.5?"#12306B":v>=5?"#B4541A":"#7A1F2B"}
function rateBadge(v){return v==null?'<span class="muted">—</span>':`<span class="rate" style="background:${rc(v)}">${v.toFixed(1)}</span>`}

function slotGroup(s,pid){const fm=FORMATIONS[s.formation];for(const [i,id] of Object.entries(s.slots||{}))if(id===pid&&fm&&fm.slots[i])return fm.slots[i].g;return grpOf(S.players.find(x=>x.id===pid))}
function rateP(s,pid){
  const lu=(s.lineup||{})[pid];if(!lu)return null;
  const ev=sheetEv(s).filter(e=>e.pid===pid);const c=t=>ev.filter(e=>e.t===t).length;
  if(!(lu.role==="s"||ev.some(e=>e.t!=="foul"&&e.t!=="injury")))return null;
  const g=c("goal"),a=c("assist"),y=c("yellow"),red=c("red"),f=c("foul");const sc=scoreOf(s);const grp=slotGroup(s,pid);
  let v=6;const parts=[];const add=(n,l)=>{if(n){v+=n;parts.push((n>0?"+":"")+n.toFixed(1)+" "+l)}};
  add(1.2*g,"أهداف");add(.6*a,"صناعة");
  if(red||y>=2)add(-2.5,"طرد");else add(-.6*y,"إنذار");
  add(-.15*f,"مخالفات");
  if(s.finished||sc.us||sc.them){if(sc.us>sc.them)add(.4,"فوز");else if(sc.us<sc.them)add(-.4,"خسارة")}
  if((grp==="GK"||grp==="DEF")&&sc.them===0&&s.finished)add(.6,"شباك نظيفة");
  if(grp==="GK"&&sc.them>=3)add(-.6,"استقبال 3+");
  add(+((s.adj||{})[pid]||0),"تقدير المدرب");
  v=Math.max(1,Math.min(10,v));return {v:Math.round(v*10)/10,parts,g,a,y,red,f,grp};
}
function discipline(){
  const D={};const get=id=>D[id]||(D[id]={owed:0,y:0,reds:0,susp:0});
  for(const s of finishedSheets()){
    Object.values(D).forEach(d=>{if(d.owed>0)d.owed--});
    const by={};sheetEv(s).forEach(e=>{if(!e.pid)return;const b=by[e.pid]||(by[e.pid]={y:0,r:0});if(e.t==="yellow")b.y++;if(e.t==="red")b.r++});
    for(const [pid,x] of Object.entries(by)){const d=get(pid);
      if(x.r||x.y>=2){d.reds++;d.owed++;d.susp++}
      else if(x.y){const before=d.y;d.y+=x.y;if(Math.floor(d.y/3)>Math.floor(before/3)){d.owed++;d.susp++}}}
  }
  return D;
}
function isSusp(pid){const d=discipline()[pid];return !!(d&&d.owed>0)}
function statusTags(p){return (p.injured?' <span class="tag pending">مصاب</span>':"")+(isSusp(p.id)?' <span class="tag struck">موقوف</span>':"")}

function autoFill(fk,pool){
  const fm=FORMATIONS[fk];if(!fm)return {};const left=[...pool];const out={};
  const take=(i,pred)=>{const j=left.findIndex(pred);if(j>=0){out[i]=left[j].id;left.splice(j,1)}};
  fm.slots.forEach((sl,i)=>take(i,p=>p.position===sl.l));
  fm.slots.forEach((sl,i)=>{if(out[i]==null)take(i,p=>grpOf(p)===sl.g)});
  fm.slots.forEach((sl,i)=>{if(out[i]==null)take(i,()=>true)});
  return out;
}
function starters(s){return Object.entries(s.lineup||{}).filter(([,x])=>x.role==="s").map(([id])=>S.players.find(p=>p.id===id)).filter(Boolean)}
function syncSlots(s){
  if(!s.formation)s.formation="4-4-2";s.slots={...(s.slots||{})};
  const st=starters(s).map(p=>p.id);
  for(const k of Object.keys(s.slots))if(!st.includes(s.slots[k]))delete s.slots[k];
  const fm=FORMATIONS[s.formation];const placed=Object.values(s.slots);
  const rest=starters(s).filter(p=>!placed.includes(p.id));
  fm.slots.forEach((sl,i)=>{if(s.slots[i]!=null||!rest.length)return;let j=rest.findIndex(p=>p.position===sl.l);if(j<0)j=rest.findIndex(p=>grpOf(p)===sl.g);if(j<0)j=0;s.slots[i]=rest[j].id;rest.splice(j,1)});
}

function oppSliders(o,attr){o=o||{};return `<div class="form">${OPP_F.map(([k,l])=>`<div class="field"><label for="op_${k}">${l}: <b id="opv_${k}">${o[k]||5}</b>/10</label><input id="op_${k}" type="range" min="1" max="10" step="1" value="${o[k]||5}" ${attr}="${k}"></div>`).join("")}</div>`}

function analyzeMatch(s){
  const sc=scoreOf(s);const ev=sheetEv(s);const L=[];const res=sc.us>sc.them?"فوز":sc.us<sc.them?"خسارة":"تعادل";
  L.push(`النتيجة: ${res} ${ltr(sc.us+"-"+sc.them)} بخطة ${FORMATIONS[s.formation]?FORMATIONS[s.formation].name:"غير محددة"}.`);
  const h=(t,a,b)=>ev.filter(e=>e.t===t&&(+e.min||0)>a&&(+e.min||0)<=b).length;
  L.push(`الأهداف: الشوط الأول ${h("goal",-1,45)} لنا و${h("og",-1,45)} علينا، الشوط الثاني ${h("goal",45,200)} لنا و${h("og",45,200)} علينا.`);
  const late=h("og",74,200);if(late)L.push(`استقبلنا ${late} هدف بعد الدقيقة 75 — مؤشر على هبوط اللياقة أو التركيز في آخر المباراة؛ يُنصح بزيادة حصص اللياقة وتبديلات مبكرة.`);
  const early=h("og",-1,15);if(early)L.push(`استقبلنا هدفاً في أول 15 دقيقة — نحتاج دخولاً أكثر تركيزاً وإحماءً أفضل.`);
  const y=ev.filter(e=>e.t==="yellow").length,r=ev.filter(e=>e.t==="red").length,f=ev.filter(e=>e.t==="foul").length;
  L.push(`الانضباط: ${y} إنذار، ${r} طرد، ${f} مخالفة.${f>=15?" عدد المخالفات مرتفع — يعرّض الفريق للكرات الثابتة والإيقافات.":""}${r?" الطرد أثّر على توازن الفريق.":""}`);
  const inj=ev.filter(e=>e.t==="injury").map(e=>(S.players.find(p=>p.id===e.pid)||{}).name).filter(Boolean);
  if(inj.length)L.push(`الإصابات: ${inj.join("، ")} — راجع الجهاز الطبي قبل المباراة القادمة.`);
  const rates=Object.keys(s.lineup||{}).map(id=>({p:S.players.find(p=>p.id===id),r:rateP(s,id)})).filter(o=>o.p&&o.r);
  const lines={};rates.forEach(o=>{(lines[o.r.grp]=lines[o.r.grp]||[]).push(o.r.v)});
  const avgL=Object.entries(lines).map(([g,a])=>[g,a.reduce((x,y)=>x+y,0)/a.length]).sort((a,b)=>b[1]-a[1]);
  if(avgL.length>1)L.push(`أفضل خط: ${GROUP_LABEL[avgL[0][0]]} (${avgL[0][1].toFixed(1)})، والأضعف: ${GROUP_LABEL[avgL[avgL.length-1][0]]} (${avgL[avgL.length-1][1].toFixed(1)}).`);
  const mom=[...rates].sort((a,b)=>b.r.v-a.r.v)[0];
  const avg=rates.length?rates.reduce((a,o)=>a+o.r.v,0)/rates.length:null;
  return {res,sc,L,mom,avg,rates};
}
function seasonStats(){
  const done=finishedSheets();const st={};
  S.players.filter(p=>p.status!=="struck").forEach(p=>st[p.id]={p,squad:0,played:0,rs:[],g:0,a:0,y:0,red:0});
  done.forEach(s=>Object.keys(s.lineup||{}).forEach(id=>{const o=st[id];if(!o)return;o.squad++;const r=rateP(s,id);if(r){o.played++;o.rs.push(r.v);o.g+=r.g;o.a+=r.a;o.y+=r.y;o.red+=(r.red||r.y>=2)?1:0}}));
  const D=discipline();
  return Object.values(st).map(o=>({...o,avg:o.rs.length?o.rs.reduce((a,b)=>a+b,0)/o.rs.length:null,att:done.length?Math.round(o.squad/done.length*100):null,susp:(D[o.p.id]||{}).susp||0,now:isSusp(o.p.id)})).sort((a,b)=>(b.avg??-1)-(a.avg??-1));
}
function recommend(opp){
  const avail=active().filter(p=>!p.injured&&!isSusp(p.id));const cnt={GK:0,DEF:0,MID:0,ATT:0};avail.forEach(p=>cnt[grpOf(p)]++);
  const done=finishedSheets();const last=done.slice(-3);
  const avgFor=last.length?last.reduce((a,s)=>a+scoreOf(s).us,0)/last.length:null,avgAg=last.length?last.reduce((a,s)=>a+scoreOf(s).them,0)/last.length:null;
  const hist={};done.forEach(s=>{if(!s.formation)return;const sc=scoreOf(s);const h=hist[s.formation]||(hist[s.formation]={n:0,pts:0});h.n++;h.pts+=sc.us>sc.them?3:sc.us===sc.them?1:0});
  const cat=opp>=7?"strong":opp>=4?"even":"weak";
  const BASE={strong:{"دفاعي":3,"متوازن":1.2,"هجومي":-1},even:{"دفاعي":1,"متوازن":3,"هجومي":1.5},weak:{"دفاعي":-.5,"متوازن":2,"هجومي":3}};
  const POP={"4-2-3-1":.4,"4-3-3":.35,"4-4-2":.3,"3-5-2":.2,"5-3-2":.2,"4-1-4-1":.2};
  const out=Object.entries(FORMATIONS).map(([k,f])=>{
    let sc=BASE[cat][f.style]+(POP[k]||0);const why=[];
    const need={GK:0,DEF:0,MID:0,ATT:0};f.slots.forEach(sl=>need[sl.g]++);
    let miss=0;["DEF","MID","ATT"].forEach(g=>miss+=Math.max(0,need[g]-cnt[g]));
    if(miss){sc-=1.5*miss;why.push(`ينقصها ${miss} لاعب متاح في الخانات المطلوبة`)}else why.push("عدد اللاعبين المتاحين يغطي كل خانات الخطة");
    if(hist[k]){const ppm=hist[k].pts/hist[k].n;sc+=(ppm-1.3)*1.5;why.push(`سجلّنا بها: ${hist[k].n} مباراة بمعدل ${ppm.toFixed(1)} نقطة`)}
    if(avgAg!=null&&avgAg>=2&&f.style==="دفاعي"){sc+=1;why.push(`نستقبل ${avgAg.toFixed(1)} هدف في آخر المباريات — نحتاج تأميناً دفاعياً`)}
    if(avgFor!=null&&avgFor<1&&f.style==="هجومي"){sc+=1;why.push(`معدل تسجيلنا ${avgFor.toFixed(1)} فقط — نحتاج عدداً أكبر في الهجوم`)}
    return {k,f,sc,why};
  }).sort((a,b)=>b.sc-a.sc);
  const catTxt=cat==="strong"?`الخصم قوي (${opp}/10): الأولوية للتنظيم الدفاعي والمرتدات`:cat==="even"?`الخصم متكافئ (${opp}/10): الأفضل خطة متوازنة تتحكم في الوسط`:`الخصم أضعف (${opp}/10): نضغط ونهاجم بعدد أكبر`;
  const stats=seasonStats();const rk=id=>{const o=stats.find(x=>x.p.id===id);return o&&o.avg!=null?o.avg:5.5};
  const pool=[...avail].sort((a,b)=>rk(b.id)-rk(a.id));
  return {top:out.slice(0,3),catTxt,cnt,xi:autoFill(out[0].k,pool),avgFor,avgAg};
}

  const o=up?(UI.tmpOppFor===up.id?UI.tmpOpp:(up.opp||{})):UI.tmpOpp;const ov=oppVal(o)??5;const rec=recommend(ov);

const SESSION_KEY="asdiqaa-session",MAX_USERS=5,DEFAULT_PIN="362801";

async function sha(t){
  t="asdiqaa|"+t;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return "f"+(h1>>>0).toString(16)+(h2>>>0).toString(16)}
}
function isMain(){return !!ME&&ME.kind==="main"}
function canFinance(){return !!ME&&(ME.kind==="main"||ME.role==="finance")}
function needFinance(){if(!canFinance()){toast("الميزانية والاشتراكات: التعديل للحساب الرئيسي والمدير المالي فقط");return false}return true}

const gate=document.getElementById("gate");

function enter(me,remember=true){ME=me;if(remember)try{localStorage.setItem(SESSION_KEY,JSON.stringify(me.kind==="main"?{kind:"main"}:{kind:"user",id:me.id}))}catch(e){}gate.hidden=true;document.getElementById("gateErr").textContent="";render()}
function restoreSession(){
  let sess=null;try{sess=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){}
  if(sess&&sess.kind==="main")return enter({kind:"main",name:"الحساب الرئيسي"},false);
  if(sess&&sess.kind==="user"){const u=S.users.find(x=>x.id===sess.id&&x.active!==false);if(u)return enter({kind:"user",id:u.id,name:u.name,role:u.role||"user"},false)}
  showGate();
}
let fails=0,lockUntil=0;
function locked(){if(Date.now()<lockUntil){document.getElementById("gateErr").textContent="محاولات كثيرة خاطئة — انتظر "+Math.ceil((lockUntil-Date.now())/1000)+" ثانية";return true}return false}
function failed(msg){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}document.getElementById("gateErr").textContent=msg}
async function tryMain(){
  if(locked())return;const pin=document.getElementById("pin").value.trim();
  if(!/^\d{6}$/.test(pin))return failed("رمز الدخول 6 أرقام");
  const want=S.settings.pinHash||await sha("pin:"+DEFAULT_PIN);
  if(await sha("pin:"+pin)===want){fails=0;document.getElementById("pin").value="";enter({kind:"main",name:"الحساب الرئيسي"})}
  else{document.getElementById("pin").value="";failed("رمز الدخول غير صحيح")}
}
async function tryUser(){
  if(locked())return;const un=document.getElementById("gUser").value.trim().toLowerCase(),pw=document.getElementById("gPass").value;
  if(!READY)return failed("جاري تحميل البيانات، حاول بعد لحظات");
  const u=S.users.find(x=>(x.username||"").toLowerCase()===un);
  if(!u||u.active===false)return failed(u?"هذا المستخدم موقوف — راجع الحساب الرئيسي":"اسم المستخدم أو كلمة المرور غير صحيحة");
  if(await sha(u.id+"|"+pw)===u.passHash){fails=0;document.getElementById("gPass").value="";enter({kind:"user",id:u.id,name:u.name,role:u.role||"user"})}
  else failed("اسم المستخدم أو كلمة المرور غير صحيحة");
}

function loadImg(u){return new Promise(r=>{if(!u)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u})}
const plain=t=>String(t||"").replace(/[\u2066-\u2069]/g,"");
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function formationImage(s){
  try{await document.fonts.ready}catch(e){}
  const fk=FORMATIONS[s.formation]?s.formation:"4-4-2";const fm=FORMATIONS[fk];const slots=Object.keys(s.slots||{}).length?s.slots:autoFill(fk,starters(s));
  const W=1080,PX=110,PY=250,PW=860,PH=1265,H=PY+PH+230;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0B1F47");g.addColorStop(1,"#13285a");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle="#F4C430";x.fillRect(0,0,W,10);x.fillRect(0,H-10,W,10);
  const logo=await loadImg(LOGO);if(logo){x.save();x.beginPath();x.arc(W-120,120,82,0,Math.PI*2);x.clip();x.drawImage(logo,W-202,38,164,164);x.restore();x.strokeStyle="#C9A23F";x.lineWidth=6;x.beginPath();x.arc(W-120,120,82,0,Math.PI*2);x.stroke()}
  x.direction="rtl";x.textAlign="right";
  x.fillStyle="#F4C430";x.font='700 54px "Reem Kufi", Tahoma, sans-serif';x.fillText(CLUB,W-230,100);
  x.fillStyle="#fff";x.font='600 34px "IBM Plex Sans Arabic", Tahoma, sans-serif';x.fillText("التشكيلة ضد "+(s.opponent||"—"),W-230,152);
  x.fillStyle="#E8D49A";x.font='500 28px "IBM Plex Sans Arabic", Tahoma, sans-serif';x.fillText([s.date,s.venue].filter(Boolean).join("  ·  "),W-230,196);
  x.textAlign="left";x.direction="ltr";x.fillStyle="#F4C430";x.font='700 46px "Reem Kufi", Tahoma, sans-serif';x.fillText(plain(fm.name).split(" ")[0],60,110);
  x.direction="rtl";x.textAlign="right";
  for(let i=0;i<10;i++){x.fillStyle=i%2?"#278536":"#2E8B3E";x.fillRect(PX,PY+PH*i/10,PW,PH/10)}
  const sx=PW/68,sy=PH/100,L=(a,b,cc,d)=>{x.beginPath();x.moveTo(PX+a*sx,PY+b*sy);x.lineTo(PX+cc*sx,PY+d*sy);x.stroke()},R=(a,b,w,h)=>x.strokeRect(PX+a*sx,PY+b*sy,w*sx,h*sy);
  x.strokeStyle="rgba(255,255,255,.8)";x.lineWidth=4;R(1,1,66,98);L(1,50,67,50);R(13.8,1,40.4,15.7);R(24.8,1,18.4,5.2);R(13.8,83.3,40.4,15.7);R(24.8,93.8,18.4,5.2);
  x.beginPath();x.arc(PX+34*sx,PY+50*sy,8.7*sx,0,Math.PI*2);x.stroke();
  const lu=s.lineup||{};
  for(const [i,sl] of fm.slots.entries()){
    const p=S.players.find(q=>q.id===slots[i]);const cx=PX+sl.x/100*PW,cy=PY+(100-sl.y)/100*PH,r=50;
    const shirt=p?((lu[p.id]&&lu[p.id].shirt)||p.shirt||""):"";
    x.fillStyle="#0B1F47";x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();
    const img=p&&p.photo?await loadImg(src(p.photo)):null;
    if(img){x.save();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.clip();const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,cx-r,cy-r,2*r,2*r);x.restore()}
    else{x.fillStyle="#F4C430";x.textAlign="center";x.font='700 40px "Reem Kufi", Tahoma, sans-serif';x.fillText(String(shirt||"?"),cx,cy+14)}
    x.strokeStyle="#F4C430";x.lineWidth=5;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();
    if(img&&shirt){x.fillStyle="#F4C430";rrect(x,cx-r-10,cy+r-30,44,32,8);x.fill();x.fillStyle="#0B1F47";x.textAlign="center";x.font='700 22px Tahoma, sans-serif';x.fillText(String(shirt),cx-r+12,cy+r-6)}
    const nm=p?shortName(p.name):sl.l;x.font='600 24px "IBM Plex Sans Arabic", Tahoma, sans-serif';x.textAlign="center";const tw=Math.min(190,x.measureText(nm).width+20);
    x.fillStyle="rgba(11,31,71,.9)";rrect(x,cx-tw/2,cy+r+6,tw,36,10);x.fill();x.fillStyle="#fff";x.fillText(nm,cx,cy+r+33,170);
  }
  x.textAlign="right";x.fillStyle="#fff";x.font='600 26px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  const subs=Object.entries(lu).filter(([,v])=>v.role==="b").map(([id,v])=>{const p=S.players.find(q=>q.id===id);return p?(v.shirt?v.shirt+" ":"")+shortName(p.name):""}).filter(Boolean);
  let y=PY+PH+50;x.fillStyle="#F4C430";x.fillText("الاحتياط:",W-60,y);x.fillStyle="#fff";
  let line="",lines=[];subs.forEach(t=>{const n=line?line+"  ·  "+t:t;if(x.measureText(n).width>W-260){lines.push(line);line=t}else line=n});if(line)lines.push(line);
  lines.slice(0,2).forEach((l,k)=>x.fillText(l,W-200,y+k*38));
  x.fillStyle="#E8D49A";x.font='500 24px "IBM Plex Sans Arabic", Tahoma, sans-serif';x.fillText("المدير الفني: "+(s.coach||S.settings.coach||"—"),W-60,H-80);
  x.textAlign="left";x.fillText("برعاية الرابطة السودانية بمنطقة عسير",60,H-80);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
async function shareFormation(s){
  if(!s)return;if(!starters(s).length)return toast("اختر اللاعبين الأساسيين أولاً");
  toast("جاري تجهيز الصورة…");const blob=await formationImage(s);if(!blob)return toast("تعذّر إنشاء الصورة");
  const name="تشكيلة-الأصدقاء-ضد-"+(s.opponent||"الخصم").replace(/\s+/g,"-")+".png";const file=new File([blob],name,{type:"image/png"});const url=URL.createObjectURL(blob);
  const text=`تشكيلة ${CLUB} ضد ${s.opponent||""} — ${s.date||""}`;
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  openDlg("مشاركة التشكيل",`<img src="${url}" alt="صورة التشكيل" style="width:100%;border-radius:10px"><p class="hint">${canShare?"اضغط «مشاركة» واختر واتساب.":"احفظ الصورة ثم أرسلها في واتساب كمرفق. زر «فتح واتساب» يفتح المحادثة بنص جاهز."}</p>
   <div class="actions"><button type="button" class="btn ghost" data-act="saveImg">⬇️ حفظ الصورة</button><a class="btn" style="background:#1FA855;color:#fff;text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">فتح واتساب</a></div>`,
   async()=>{if(canShare){try{await navigator.share({files:[file],title:text,text})}catch(e){if(e&&e.name!=="AbortError")toast("تعذّرت المشاركة")}return "silent"}await saveBlob(blob,name);return false},canShare?"📤 مشاركة":"⬇️ حفظ الصورة");
  ACT.saveImg=()=>saveBlob(blob,name);
}
async function saveBlob(blob,name){
  if(typeof downloads!=="undefined"&&downloads){try{await downloads.save({filename:name,data:blob});toast("تم حفظ الصورة")}catch(e){}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("تم حفظ الصورة");
}

function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+" ميغابايت":Math.max(1,Math.round(n/1024))+" كيلوبايت"}
function backupData(){const d={app:"asdiqaa-club",version:APP_VERSION,at:new Date().toISOString(),settings:S.settings};COLS.forEach(c=>d[c]=S[c]);return d}

async function putFileId(id,data){

/* النسخ الاحتياطي التلقائي (نسخة يومية تُحفظ في قاعدة البيانات، آخر 7 نسخ) */
let BK_INDEX=null;
async function loadBackupIndex(){if(!hasFdb())return null;try{BK_INDEX=(await fdb.ref("backupIndex").get()).val()||{}}catch(e){BK_INDEX={}}return BK_INDEX}
async function autoBackup(force=false){
  if(!hasFdb()||!isMain()||!READY)return;
  const idx=await loadBackupIndex();const key=force?stamp():today();
  if(!force&&idx[key])return;
  const json=JSON.stringify(backupData());
  await fdb.ref("backups/"+key).set(json);
  await fdb.ref("backupIndex/"+key).set({at:new Date().toISOString(),by:ME.name,size:json.length,players:S.players.length,auto:!force});
  const keys=Object.keys({...idx,[key]:1}).sort();
  for(const k of keys.slice(0,Math.max(0,keys.length-7))){await fdb.ref("backups/"+k).remove();await fdb.ref("backupIndex/"+k).remove()}
  await loadBackupIndex();if(UI.route==="backup")render();
}
{const _enter=enter;enter=function(...a){_enter(...a);if(isMain())onReady(()=>setTimeout(()=>autoBackup().catch(e=>console.warn(e)),2500))}}

async function downloadBackup(withFiles){
  const d=backupData();
  if(withFiles&&typeof getFile==="function"){toast("جاري تجميع المرفقات…");d.files={};for(const id of fileIds()){const v=await getFile(id);if(v)d.files[id]=v}}
  const blob=new Blob([JSON.stringify(d)],{type:"application/json"});
  await saveBlob(blob,"نسخة-احتياطية-الأصدقاء-"+stamp()+".json");
  try{localStorage.setItem("asdiqaa-lastbk",new Date().toISOString())}catch(e){}
  render();
}
async function restoreAll(d){
  toast("جاري الاستعادة…");
  if(hasFdb()){
    const club={settings:d.settings||{}};COLS.forEach(c=>{club[c]={};(d[c]||[]).forEach(it=>{const x={...it};delete x.id;club[c][it.id]=x})});
    await fdb.ref("club").set(JSON.parse(JSON.stringify(club)));
  }else{
    for(const c of COLS){const keep=new Set((d[c]||[]).map(x=>x.id));
      for(const it of [...S[c]])if(!keep.has(it.id))await del(c,it.id);
      for(const it of (d[c]||[]))await put(c,it)}
    await saveSettings(d.settings||{});
  }
  if(d.files)for(const [id,v] of Object.entries(d.files))await putFileId(id,v);
  if(!cloud&&typeof localSave==="function")localSave();
  toast("تمت استعادة النسخة بنجاح");render();
}

   <p><b>${esc(label)}</b><br>تاريخ النسخة: ${esc(new Date(d.at).toLocaleString("ar-SA-u-ca-gregory"))}</p>
   <p>اللاعبون ${n("players")} · الطاقم ${n("staff")} · الأعضاء ${n("members")} · حركات الميزانية ${n("finance")} · كشوفات المباريات ${n("sheets")} · الخطابات ${n("letters")} · المستخدمون ${n("users")}${d.files?" · المرفقات "+Object.keys(d.files).length:""}</p>

   async o=>{if(o.ok!=="استعادة")throw new Error("اكتب كلمة «استعادة» للتأكيد");await restoreAll(d);return "silent"},"استعادة النسخة");
}

   `<div class="note">النسخ التلقائية اليومية تعمل في نسخة البرنامج المرفوعة على Vercel. هنا استخدم «تنزيل نسخة البيانات» بشكل دوري.</div>`}`;
}
